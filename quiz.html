    <header class="page-header">
        <div class="container">
            <span class="page-tag">QUIZ</span>
            <h1 class="page-title">核战历史知识测验</h1>
            <p class="page-subtitle">测试你对这段历史的了解程度</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="quiz-container" id="quizContainer">
                <!-- Quiz will be generated by JavaScript -->
            </div>
            
            <div class="quiz-result" id="quizResult" style="display: none;">
                <div class="quiz-score" id="quizScore">0/5</div>
                <div class="quiz-feedback" id="quizFeedback"></div>
                <button class="quiz-restart" onclick="restartQuiz()">重新测试</button>
            </div>
        </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-logo">铭记历史 · 呼唤和平</div>
            <div class="footer-nav">
                <a href="index.html">首页</a>
                <a href="timeline.html">时间线</a>
                <a href="bombs.html">原子弹</a>
                <a href="survivors.html">幸存者</a>

            </div>

    <style>
        .quiz-container { max-width: 700px; margin: 0 auto; }
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 35px;
            margin-bottom: 30px;
        }
        .quiz-question {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 12px; }
        .quiz-option {
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .quiz-option:hover { border-color: rgba(139, 0, 0, 0.5); background: rgba(139, 0, 0, 0.1); }
        .quiz-option.selected { border-color: var(--accent-red); background: rgba(139, 0, 0, 0.2); }
        .quiz-option.correct { border-color: #00cc66; background: rgba(0, 204, 102, 0.2); }
        .quiz-option.wrong { border-color: var(--accent-red); background: rgba(139, 0, 0, 0.2); }
        .quiz-result {
            text-align: center;
            padding: 50px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid rgba(139, 0, 0, 0.3);
            max-width: 500px;
            margin: 0 auto;
        }
        .quiz-score { font-family: 'Noto Serif SC', serif; font-size: 4rem; font-weight: 700; color: var(--accent-red); margin-bottom: 15px; }
        .quiz-feedback { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 30px; line-height: 1.6; }
        .quiz-restart {
            display: inline-block;
            padding: 14px 35px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .quiz-restart:hover { background: var(--accent-red-light); transform: translateY(-2px); }
        .quiz-nav { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .quiz-prev, .quiz-next {
            padding: 12px 30px;
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .quiz-prev:hover, .quiz-next:hover { border-color: var(--accent-red); }
    </style>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const quizData = [
            {
                question: "人类历史上第一颗用于实战的原子弹于何时何地投下？",
                options: ["1945年8月6日 广岛", "1945年8月9日 长崎", "1945年7月16日 新墨西哥", "1945年8月6日 长崎"],
                correct: 0
            },
            {
                question: "广岛原子弹"小男孩"是什么类型的核武器？",
                options: ["钚弹", "铀弹", "氢弹", "三相弹"],
                correct: 1
            },
            {
                question: "根据官方统计，广岛原子弹爆炸当日死亡人数约为多少？",
                options: ["约3万人", "约8万人", "约15万人", "约25万人"],
                correct: 1
            },
            {
                question: "2024年诺贝尔和平奖授予了哪个组织？",
                options: ["国际原子能机构", "日本原氢弹受害者团体协会", "广岛和平纪念馆", "联合国裁军事务厅"],
                correct: 1
            },
            {
                question: "《禁止核武器条约》于哪一年在联合国通过？",
                options: ["1968年", "1987年", "1996年", "2017年"],
                correct: 3
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = [];

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            const q = quizData[currentQuestion];
            
            let html = `
                <div class="quiz-card" data-aos="fade-up">
                    <div class="quiz-question">第${currentQuestion + 1}题：${q.question}</div>
                    <div class="quiz-options">
                        ${q.options.map((opt, i) => `
                            <div class="quiz-option" onclick="selectAnswer(${i})">${opt}</div>
                        `).join('')}
                    </div>
                </div>
                <div class="quiz-nav">
                    <button class="quiz-prev" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled style="opacity:0.3"' : ''}>上一题</button>
                    <button class="quiz-next" onclick="nextQuestion()" ${currentQuestion === quizData.length - 1 ? 'disabled style="opacity:0.3"' : ''}>下一题</button>
                </div>
            `;
            container.innerHTML = html;
            
            if (answered[currentQuestion] !== undefined) {
                const options = container.querySelectorAll('.quiz-option');
                options.forEach((opt, i) => {
                    if (i === quizData[currentQuestion].correct) opt.classList.add('correct');
                    if (i === answered[currentQuestion] && i !== quizData[currentQuestion].correct) opt.classList.add('wrong');
                    opt.style.pointerEvents = 'none';
                });
            }
        }

        function selectAnswer(index) {
            if (answered[currentQuestion] !== undefined) return;
            answered[currentQuestion] = index;
            if (index === quizData[currentQuestion].correct) score++;
            renderQuiz();
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                renderQuiz();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuiz();
            }
        }

        function showResult() {
            document.getElementById('quizContainer').style.display = 'none';
            const resultDiv = document.getElementById('quizResult');
            resultDiv.style.display = 'block';
            document.getElementById('quizScore').textContent = score + '/' + quizData.length;
            
            let feedback = '';
            if (score === quizData.length) {
                feedback = '太棒了！你对这段历史了解得非常透彻。';
            } else if (score >= quizData.length * 0.6) {
                feedback = '不错的成绩！你对核战历史有了基本的了解。';
            } else {
                feedback = '建议回顾一下网站的内容，加深对这段历史的认识。';
            }
            document.getElementById('quizFeedback').textContent = feedback;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = [];
            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('quizResult').style.display = 'none';
            renderQuiz();
        }

        AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 100 });
        window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50));
        function toggleMenu() { document.getElementById('mobileMenu').classList.toggle('active'); }
        
        renderQuiz();
    </script>
</body>
</html>
