<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect fill="#1a2020" width="800" height="500"/>
  <!-- Sky gradient -->
  <rect fill="url(#sky)" width="800" height="300"/>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2530"/>
      <stop offset="100%" style="stop-color:#2a3540"/>
    </linearGradient>
  </defs>
  <!-- Ground -->
  <rect y="300" width="800" height="200" fill="#1a1a1a"/>
  <!-- Fountain/dome outline -->
  <ellipse cx="400" cy="350" rx="100" ry="30" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <path d="M300,350 Q400,200 500,350" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <!-- Dove silhouette -->
  <path d="M380,280 Q400,260 420,280 Q400,290 380,280 M400,275 L410,265" fill="#4a90d9" opacity="0.5"/>
  <!-- Text -->
  <text x="400" y="470" text-anchor="middle" fill="#4a90d9" font-size="14">和平公园 - Peace Park</text>
</svg>